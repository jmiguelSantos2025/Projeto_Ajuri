<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {# Token anti-CSRF lido pelo JavaScript em requisições feitas com fetch #}
  <meta name="csrf-token" content="{{ session.csrf_token }}">
  <title>{% block titulo %}Ajuri{% endblock %}</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("ajuri-theme") === "dark" ? "dark" : "light"
    } catch (error) {
      console.error("Não foi possível recuperar o tema salvo do Ajuri.", error)
      document.documentElement.dataset.theme = "light"
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
  {% block corpo %}{% endblock %}
  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  {# Scripts extras de cada página (ex.: voz.js na Home) #}
  {% block scripts %}{% endblock %}
</body>
</html>
